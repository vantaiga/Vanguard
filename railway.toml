# Vanguard Protocol — Railway Configuration
# Primary OOM fix: 80MB → 320MB heap
# Removed --experimental-vm-modules (not needed)
# Removed better-sqlite3 from everywhere
# /data volume mount for db.js persistence

[build]
builder = "nixpacks"

[deploy]
startCommand = "node --max-old-space-size=320 --max-semi-space-size=32 --expose-gc --no-concurrent-sweeping src/index.js"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
healthcheckPath = "/api/health"
healthcheckTimeout = 30

[[volumes.mounts]]
mountPath = "/data"
